function startEdit(){
  const kind=state.active; const id=selFor(kind); if(!id) return;
  const base={...recordById(kind,id)};
  if(kind==='rep') base._photo = PHOTO_CACHE.get(id) || '';
  state.mode[kind]='edit'; state.draftData[kind]=base; state.draftKey[kind]=kind+':edit:'+id;
  if(kind==='rep' && base.hasPhoto && !PHOTO_CACHE.has(id)){
    ensurePhotoLoaded(id).then(v=>{ if(v && state.mode.rep==='edit' && selFor('rep')===id){ state.draftData.rep._photo=v; const f=REP_FIELDS.find(x=>x.id==='repPhoto'); const holder=document.querySelector('[data-field="repPhoto"]'); if(holder){ holder.outerHTML=renderField('rep', f, state.draftData.rep, true); wireValidation('rep',[f],state.draftData.rep); } } });
  }
  renderAll(); refreshActionBar();
  logEvent(`Editing "${nameOf(kind,id)}".`);
}
function discardCurrent(){
  const kind=state.active; const wasNew = state.mode[kind]==='new';
  clearDraft(kind); state.mode[kind]='browse';
  if(wasNew) setSelFor(kind, state.prevSel[kind]);
  renderAll(); refreshActionBar();
  logEvent('Discarded changes.', {transient:true});
}
function findDuplicate(kind, data){
  const nm=(data[nameField(kind)]||'').trim().toLowerCase(); if(!nm) return null;
  return arrFor(kind).find(r=>{
    if(r.id===data.id) return false;
    if((r[nameField(kind)]||'').trim().toLowerCase()!==nm) return false;
    if(kind==='asso') return true;
    if(kind==='firm') return r.assoId===data.assoId;
    return r.firmId===data.firmId;
  }) || null;
}
async function saveCurrent(){
  const kind=state.active; const mode=state.mode[kind]; const fields=fieldsFor(kind);
  if(!validateAll(fields)){ logEvent('Please fix the highlighted fields before saving.'); toast('Please fix the highlighted fields before saving.', 'err'); return; }
  const existing = mode==='edit' ? {...recordById(kind, selFor(kind))} : (kind==='firm'?{assoId:state.selAsso}:kind==='rep'?{firmId:state.selFirm}:{});
  const data = collectData(fields, existing);
  const dup = findDuplicate(kind, data);
  if(dup){
    const go = await showDialog({ title:'Possible duplicate', message:`A record named "${data[nameField(kind)]}" already exists. Add it again anyway?`, ok:tr('Create anyway'), cancel:tr('Cancel') });
    if(!go) return;
  }
  const saved = await saveRecord(kind, data);
  if(kind==='asso'){ learnGeoScope(saved.assoGeoType, saved.assoGeoScope); state.selAsso=saved.id; }
  if(kind==='firm'){ learnAddress(saved.firmArea,saved.firmTown,saved.firmDistrict,saved.firmProvince,saved.firmPin); ensureFreq(learning.firmCategories,saved.firmCategory); ensureFreq(learning.streetSuggestions,saved.firmStreet); ensureFreq(learning.memOwnType,saved.memOwnType); saveLearning(); state.selFirm=saved.id; }
  if(kind==='rep'){ learnAddress(saved.repArea,saved.repTown,saved.repDistrict,saved.repProvince,saved.repPin); ensureFreq(learning.repRelations,saved.repRelation); ensureFreq(learning.streetSuggestions,saved.repStreet); saveLearning(); state.selRep=saved.id; }
  state.mode[kind]='browse'; clearDraft(kind);
  renderAll(); refreshActionBar();
  logEvent(`Saved "${nameOf(kind, saved.id)}" successfully.`);
  toast(`Saved "${nameOf(kind, saved.id)}".`, 'ok');
}
function collectSubtree(kind, id){
  const out=[];
  if(kind==='asso'){ const r=recordById('asso',id); if(r) out.push({kind:'asso', rec:{...r}}); FIRMS.filter(f=>f.assoId===id).forEach(f=>{ out.push({kind:'firm', rec:{...f}}); REPS.filter(x=>x.firmId===f.id).forEach(x=>out.push({kind:'rep', rec:{...x}})); }); }
  else if(kind==='firm'){ const r=recordById('firm',id); if(r) out.push({kind:'firm', rec:{...r}}); REPS.filter(x=>x.firmId===id).forEach(x=>out.push({kind:'rep', rec:{...x}})); }
  else { const r=recordById('rep',id); if(r) out.push({kind:'rep', rec:{...r}}); }
  return out;
}
async function restoreSnapshot(snapshot, photoSnap){
  for(const {kind, rec} of snapshot){
    const arr=arrFor(kind); if(!arr.find(r=>r.id===rec.id)) arr.push({...rec});
    lsSet(lsKeyFor(kind), arr);
    if(!localMode && !String(rec.id).startsWith('local_')){ const {id,...d}=rec; try{ await setDoc(doc(db,collNameFor(kind),id), d); }catch(e){ markPending(); } }
  }
  if(photoSnap) for(const [id,d] of photoSnap){ await savePhoto(id, d); }
  renderAll(); refreshActionBar();
  logEvent('Restored deleted record(s).');
}
async function deleteCurrent(){
  const kind=state.active; const id=selFor(kind); if(!id) return;
  const label=nameOf(kind,id)||'this record';
  const n=countDescendants(kind,id);
  const msg = n>0 ? `Delete "${label}" and its ${n} related record(s)? This removes them everywhere.` : `Delete "${label}"?`;
  const ok=await showDialog({ title:tr('Delete this record?'), message:msg, ok:tr('Yes, delete'), cancel:tr('Cancel'), danger:true });
  if(!ok) return;
  const snapshot=collectSubtree(kind,id);
  const photoSnap=new Map();
  snapshot.forEach(({kind:k,rec})=>{ if(k==='rep' && PHOTO_CACHE.has(rec.id)) photoSnap.set(rec.id, PHOTO_CACHE.get(rec.id)); });
  await deleteRecord(kind,id);
  if(kind==='asso'){ state.selAsso=null; state.selFirm=null; state.selRep=null; }
  if(kind==='firm'){ state.selFirm=null; state.selRep=null; }
  if(kind==='rep'){ state.selRep=null; }
  state.mode[kind]='browse';
  renderAll(); refreshActionBar();
  logEvent(`Deleted "${label}"${n?` and ${n} related record(s)`:''}.`);
  toast(`Deleted "${label}".`, 'ok', { actionLabel:'Undo', onAction:()=>restoreSnapshot(snapshot, photoSnap) });
}

/* =====================================================================
   Action row + space popup
   ===================================================================== */
function refreshActionBar(){ renderActionRow(); }
function renderActionRow(){
  const row=document.getElementById('actionRow'); if(!row) return;
  const kind=state.active; const mode=state.mode[kind]; const hasSel=selFor(kind);
  const spaceName=tr(kind==='asso'?'Assoc':kind==='firm'?'Firm':'Rep');
  const spaceLabel=tr(kind==='asso'?'Association':kind==='firm'?'Member Firms':'Representative');
  const newDisabled=(kind==='firm'&&!state.selAsso)||(kind==='rep'&&!state.selFirm);
  const btns=[
    { label:spaceLabel, action:openSpacePopup },
    mode==='browse' ? { label:tr('New')+' '+spaceName, disabled:newDisabled, action:startNew } : { label:tr('Discard')+' '+spaceName, action:discardCurrent },
    mode==='browse' ? { label:tr('Edit')+' '+spaceName, disabled:!hasSel, action:startEdit } : { label:tr('Save')+' '+spaceName, action:saveCurrent }
  ];
  if(mode==='browse') btns.push({ label:tr('Delete')+' '+spaceName, disabled:!hasSel, danger:true, action:deleteCurrent });
  row.innerHTML = btns.map((b,i)=>`<button type="button" data-i="${i}" class="${b.danger?'danger':''}" ${b.disabled?'disabled':''}>${esc(b.label)}</button>`).join('');
  row.querySelectorAll('button').forEach(el=>{ const b=btns[+el.dataset.i]; el.addEventListener('click', ()=>{ if(!b.disabled) b.action(); }); });
}
function focusFirstField(kind){ const grid=document.querySelector(`#panel-${kind} .field-grid`); const first=grid && grid.querySelector('input, select, textarea'); if(first) first.focus(); }
function closeSpacePopup(){ const pop=document.getElementById('spacePopup'); if(pop){ pop.style.display='none'; pop.innerHTML=''; } }
function openSpacePopup(){
  const pop=document.getElementById('spacePopup'); if(!pop) return;
  const items=[['asso','Association'],['firm','Member Firms'],['rep','Representative']];
  pop.innerHTML=`<div class="space-popup-box" role="dialog" aria-modal="true">${items.map(([v,l])=>
    `<button type="button" class="space-popup-item ${state.active===v?'current':''}" data-v="${v}">${esc(tr(l))}</button>`).join('')}</div>`;
  pop.style.display='flex';
  pop.querySelectorAll('.space-popup-item').forEach(el=> el.addEventListener('click', ()=>{ const v=el.dataset.v; closeSpacePopup(); setActivePanel(v); focusFirstField(v); }));
  pop.addEventListener('click', (e)=>{ if(e.target.id==='spacePopup') closeSpacePopup(); });
}

/* =====================================================================
   Dialog, toast, sheets, theme
   ===================================================================== */
function showDialog({title, message, ok, cancel, danger}){
  return new Promise(resolve=>{
    const ov=document.getElementById('dlgOverlay');
    document.getElementById('dlgTitle').textContent=title||'';
    document.getElementById('dlgMsg').textContent=message||'';
    const okBtn=document.getElementById('dlgOk'); const cancelBtn=document.getElementById('dlgCancel');
    okBtn.textContent=ok||tr('OK'); cancelBtn.textContent=cancel||tr('Cancel');
    okBtn.className = danger ? 'danger' : '';
    ov.style.display='flex';
    const done=(v)=>{ ov.style.display='none'; okBtn.onclick=null; cancelBtn.onclick=null; ov.onclick=null; document.removeEventListener('keydown', keyh); resolve(v); };
    const keyh=(e)=>{ if(e.key==='Escape') done(false); };
    okBtn.onclick=()=>done(true); cancelBtn.onclick=()=>done(false);
    ov.onclick=(e)=>{ if(e.target===ov) done(false); };
    document.addEventListener('keydown', keyh);
    okBtn.focus();
  });
}
function toast(msg, type, opts){
  opts=opts||{};
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast '+(type||'');
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(opts.actionLabel){ const b=document.createElement('button'); b.textContent=opts.actionLabel; b.addEventListener('click', ()=>{ if(opts.onAction) opts.onAction(); el.remove(); }); el.appendChild(b); }
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, opts.duration||6000);
}
function openSheet(html){ document.getElementById('sheetBody').innerHTML=html; document.getElementById('sheetOverlay').style.display='flex'; }
function closeSheet(){ document.getElementById('sheetOverlay').style.display='none'; }
document.getElementById('sheetOverlay').addEventListener('click', e=>{ if(e.target.id==='sheetOverlay') closeSheet(); });
function openMoreSheet(){
  const items=[['theme', tr('Theme')], ['exportjson', tr('Export backup (JSON)')], ['exportcsv', tr('Export CSV')], ['import', tr('Import backup')],
    ['a11y', tr('Field announcements')+': '+(a11yAnnounce?'ON':'OFF')], ['lang', tr('Language')+': '+(lang==='en'?'English':'தமிழ்')], ['retry', tr('Retry sync')]];
  openSheet(`<div class="sheet-title">${esc(tr('More'))}</div>`+items.map(([k,l])=>`<button type="button" class="sheet-item" data-k="${k}">${esc(l)}</button>`).join(''));
  document.getElementById('sheetBody').querySelectorAll('.sheet-item').forEach(el=> el.addEventListener('click', ()=>{
    const k=el.dataset.k;
    if(k==='theme'){ openThemeSheet(); return; }
    closeSheet();
    if(k==='exportjson') exportJSON();
    else if(k==='exportcsv') openCsvSheet();
    else if(k==='import') document.getElementById('importFile').click();
    else if(k==='a11y') toggleA11yAnnounce();
    else if(k==='lang') toggleLanguage();
    else if(k==='retry') retryPending();
  }));
}
function openCsvSheet(){
  openSheet(`<div class="sheet-title">${esc(tr('Export CSV'))}</div>`+['asso','firm','rep'].map(k=>
    `<button type="button" class="sheet-item" data-k="${k}">${esc(tr(k==='asso'?'Association':k==='firm'?'Member Firms':'Representative'))}</button>`).join(''));
  document.getElementById('sheetBody').querySelectorAll('.sheet-item').forEach(el=> el.addEventListener('click', ()=>{ closeSheet(); exportCSV(el.dataset.k); }));
}
function openThemeSheet(){
  const cur=lsGet(LS_THEME,0);
  openSheet(`<div class="sheet-title">${esc(tr('Theme'))}</div><div class="swatch-row">`+THEMES.map((t,i)=>
    `<button type="button" class="swatch ${i===cur?'active':''}" data-i="${i}" style="background:${escAttr(t.accent)}" aria-label="Theme ${i+1}"></button>`).join('')+`</div>`);
  document.getElementById('sheetBody').querySelectorAll('.swatch').forEach(el=> el.addEventListener('click', ()=>{ applyTheme(+el.dataset.i); closeSheet(); logEvent('Theme updated.', {transient:true}); }));
}
const THEMES = [
 {bg:'#E3F2FD', input:'#F5FAFF', accent:'#1976D2', palette:['#1976D2','#00897B','#6A1B9A','#C2185B','#EF6C00','#2E7D32']},
 {bg:'#E8F5E9', input:'#F3FBF3', accent:'#2E7D32', palette:['#2E7D32','#0277BD','#8E24AA','#D81B60','#F57C00','#00838F']},
 {bg:'#F3E5F5', input:'#FAF3FB', accent:'#7B1FA2', palette:['#7B1FA2','#00897B','#1565C0','#C2185B','#EF6C00','#43A047']},
 {bg:'#FFF3E0', input:'#FFF8ED', accent:'#EF6C00', palette:['#EF6C00','#1976D2','#6A1B9A','#C2185B','#2E7D32','#00838F']},
 {bg:'#FCE4EC', input:'#FEF1F5', accent:'#C2185B', palette:['#C2185B','#00897B','#5E35B1','#EF6C00','#2E7D32','#0277BD']},
 {bg:'#E1F5FE', input:'#F0FAFE', accent:'#0277BD', palette:['#0277BD','#EF6C00','#8E24AA','#C2185B','#2E7D32','#00838F']}
];
function applyTheme(idx){ const t=THEMES[idx]||THEMES[0]; const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--input-bg',t.input); r.setProperty('--accent',t.accent);
  t.palette.forEach((c,i)=> r.setProperty('--g'+(i+1), c)); lsSet(LS_THEME, idx);
}
document.getElementById('themeBtn').addEventListener('click', openThemeSheet);
document.getElementById('moreBtn').addEventListener('click', openMoreSheet);

/* =====================================================================
   Export / import
   ===================================================================== */
function downloadFile(name, content, mime){
  const blob=new Blob([content], {type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportJSON(){
  const photos={}; PHOTO_CACHE.forEach((v,k)=>{ photos[k]=v; });
  const payload={ app:'Traders Association', version:1, exportedAt:nowISO(), associations:ASSOS, firms:FIRMS, representatives:REPS, lists:learning, photos };
  downloadFile(`traders-association-${stamp()}.json`, JSON.stringify(payload,null,2), 'application/json');
  logEvent('Exported a JSON backup.'); toast('Backup exported.', 'ok');
}
function csvCell(v){ const s=(v===null||v===undefined)?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(kind){
  const fields=fieldsFor(kind).filter(f=>f.type!=='photo'); const arr=arrFor(kind);
  const lines=[['id', ...fields.map(f=>f.id), 'updatedAt'].join(',')];
  arr.forEach(r=> lines.push([r.id, ...fields.map(f=>csvCell(r[f.id])), csvCell(r.updatedAt)].join(',')));
  downloadFile(`traders-${kind}-${stamp()}.csv`, lines.join('\n'), 'text/csv');
  logEvent(`Exported ${arr.length} ${kind} record(s) to CSV.`); toast('CSV exported.', 'ok');
}
document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  try{
    const obj=JSON.parse(await file.text());
    if(!obj || !Array.isArray(obj.associations)) throw new Error('not a backup');
    const ok=await showDialog({ title:tr('Import backup'), message:`Import ${obj.associations.length} association(s), ${(obj.firms||[]).length} firm(s), ${(obj.representatives||[]).length} representative(s)? Records with the same id are updated.`, ok:tr('Merge'), cancel:tr('Cancel') });
    if(!ok) return;
    await importData(obj);
    logEvent('Imported a backup.'); toast('Backup imported.', 'ok');
  }catch(err){ console.warn(err); toast('That file could not be read as a backup.', 'err'); }
});
async function importData(obj){
  const merge=(kind, incoming)=>{ const arr=arrFor(kind); (incoming||[]).forEach(rec=>{ const i=arr.findIndex(r=>r.id===rec.id); if(i>=0) arr[i]={...arr[i],...rec}; else arr.push({...rec}); }); lsSet(lsKeyFor(kind), arr); };
  merge('asso', obj.associations); merge('firm', obj.firms); merge('rep', obj.representatives);
  if(obj.lists) Object.keys(obj.lists).forEach(k=>{ learning[k]={...(learning[k]||{}), ...obj.lists[k]}; });
  lsSet(LS_LEARN, learning);
  if(obj.photos) for(const [id,d] of Object.entries(obj.photos)) await savePhoto(id, d);
  if(!localMode){
    for(const kind of ['asso','firm','rep']) for(const rec of arrFor(kind)){
      const {id,...d}=rec; try{ await setDoc(doc(db,collNameFor(kind),id), d); }catch(e){ markPending(); }
    }
  }
  renderAll(); refreshActionBar();
}

/* =====================================================================
   Event log
   ===================================================================== */
let logHistory=[]; let recentLines=['Ready.']; let logExpanded=false;
function logEvent(msg, opts){
  opts=opts||{};
  recentLines.unshift(msg); if(recentLines.length>2) recentLines.length=2;
  renderLogPreview();
  if(!opts.transient){
    const time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    logHistory.unshift(`[${time}] ${msg}`);
    if(logHistory.length>50) logHistory.pop();
    if(logExpanded) renderLogHistory();
  }
}
function renderLogPreview(){
  const prev=document.getElementById('eventLogPreview'); if(!prev) return;
  prev.innerHTML = recentLines.map(m=>`<div class="log-preview-item">${esc(m)}</div>`).join('');
}
function renderLogHistory(){
  const hist=document.getElementById('eventLogHistory'); if(!hist) return;
  hist.innerHTML = logHistory.map(h=>`<div class="log-item">${esc(h)}</div>`).join('') || '<div class="log-item">No events yet.</div>';
}
function setLogExpanded(expanded){
  logExpanded=expanded;
  document.getElementById('eventLogHistory').style.display = expanded ? 'block' : 'none';
  document.getElementById('logToggleIcon').textContent = expanded ? '▾' : '▴';
  if(expanded) renderLogHistory();
}
const logLine=document.getElementById('logLineClickable');
logLine.setAttribute('tabindex','0');
logLine.addEventListener('focus', ()=> setLogExpanded(true));
logLine.addEventListener('blur', ()=> setLogExpanded(false));
logLine.addEventListener('click', ()=> logLine.focus());

/* =====================================================================
   Language
   ===================================================================== */
function applyLanguageUI(){
  document.getElementById('assoHeaderLabel').textContent=tr('Association');
  document.getElementById('firmHeaderLabel').textContent=tr('Member Firms');
  document.getElementById('repHeaderLabel').textContent=tr('Representatives');
}
function toggleLanguage(){
  lang = (lang==='en') ? 'ta' : 'en'; lsSet(LS_LANG, lang); applyLanguageUI();
  ['asso','firm','rep'].forEach(k=>{ const b=document.getElementById(k+'Body'); b.dataset.rkey=''; b.innerHTML=''; });
  renderAll(); refreshActionBar();
  logEvent(`Language set to ${lang==='en'?'English':'தமிழ்'}.`, {transient:true});
}

/* =====================================================================
   Init
   ===================================================================== */
window.addEventListener('beforeunload', (e)=>{
  if(['asso','firm','rep'].some(k=>state.mode[k]!=='browse')){ e.preventDefault(); e.returnValue=''; }
});
window.addEventListener('online', ()=> retryPending());

async function init(){
  loadLocalOnly();
  try{ (await PhotoStore.all()).forEach(([k,v])=> PHOTO_CACHE.set(k,v)); }catch(e){ console.warn('photo cache load failed', e); }
  setupListDelegation();
  applyLanguageUI();
  applyTheme(lsGet(LS_THEME,0));
  setActivePanel('asso');
  // Offer to resume any unsaved form from a previous session.
  const draftKinds = ['asso','firm','rep'].filter(k=>{ const d=lsGet('ta_draft_'+k,null); return d && d.key && d.data; });
  if(draftKinds.length){
    const k=draftKinds[0];
    setTimeout(()=> toast(`${tr('Unsaved work found')} (${tr(k==='asso'?'Assoc':k==='firm'?'Firm':'Rep')}).`, 'ok', { duration:9000, actionLabel:tr('Resume'), onAction:()=> resumeDraft(k) }), 800);
  }
  logEvent(`Loaded ${ASSOS.length} association(s), ${FIRMS.length} firm(s), ${REPS.length} representative(s) from local cache.`);
  setConn('connecting','Connecting…');
  const connected = await initFirebase();
  if(connected){
    const synced = await syncFromCloud();
    if(synced){ renderAll(); refreshActionBar(); logEvent(`Synced ${ASSOS.length} association(s), ${FIRMS.length} firm(s), ${REPS.length} representative(s) from the cloud.`); }
  } else {
    logEvent('Running in local mode — data is saved on this device.');
  }
}
init();
